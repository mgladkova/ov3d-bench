name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # PyTorch3D supplies the 3D IoU every metric needs and is not on PyPI, so
      # the environment comes from conda. Runners have no GPU, so `pytorch-cuda`
      # is swapped for `cpuonly` rather than simply deleted: deleting it leaves
      # conda free to pick a CUDA-built pytorch3d against a CPU torch, which then
      # fails at import with a missing libc10_cuda.so.
      - name: Build a CPU environment from environment.yml
        run: |
          sed 's/- pytorch-cuda=.*/- cpuonly/' environment.yml > environment-ci.yml
          cat environment-ci.yml
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment-ci.yml
          activate-environment: ov3d-bench
          auto-activate-base: false

      - name: Show versions
        run: |
          python -c "import torch, pytorch3d, numpy; \
            print('torch', torch.__version__, '| pytorch3d', pytorch3d.__version__, \
                  '| numpy', numpy.__version__)"

      - name: Install the package and test dependencies
        run: pip install -e '.[dev]'

      # Metric tests self-skip if PyTorch3D is unusable, so this step still
      # covers the loaders, ontology and CLI. -rs reports what was skipped.
      - name: Smoke test
        run: pytest tests/test_smoke.py -v -rs

      - name: CLI is wired
        run: ov3d-bench --help
